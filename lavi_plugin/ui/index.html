<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lavi</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-regular.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-medium.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-semibold.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-bold.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}

/* lavi · paleta das referências dela: cinza, orquídea, lima, mulberry, pink. Sem degradê.
   Estrutura: marca + barra de ícones (só o principal colorido) + lista limpa por grupo. */
:root{
  --bg:#F5F1EE; --card:#FFFFFF; --card2:#FAF7F5; --ink:#3E4B57; --ink2:#56636E; --muted:#8B939A;
  --line:#EBE1DC; --line2:#DDD1CB;
  --mul:#3E4B57; --orchid:#D6B3AB; --lime:#D6B3AB; --tidal:#F4E8E5; --pink:#A88A80; --sand:#EFE5E1;
  --grad:var(--mul); --on-grad:#FFFFFF; --soft:#F4E8E5; --accent-text:var(--pink);
  --sel:#D6B3AB; --on-sel:#2F3A44;
  --ok:var(--mul); --warn:#B08A7E; --bad:#9A5B53;
  --shadow:0 1px 2px rgba(62,75,87,.04),0 10px 30px -12px rgba(62,75,87,.12);
  --shadow-up:0 10px 24px -8px rgba(62,75,87,.25);
  --r:16px; --rs:10px;
  --ui:Poppins,'Segoe UI',system-ui,sans-serif; --display:var(--ui); --serif:var(--ui);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme="dark"]{
  --bg:#1C2126; --card:#252B31; --card2:#2C333A; --ink:#EEF0F2; --ink2:#C9CFD5; --muted:#8B939A;
  --line:#343C44; --line2:#414A53;
  --grad:#D6B3AB; --on-grad:#1F262D; --soft:rgba(214,179,171,.12); --accent-text:#D6B3AB;
  --sel:#D6B3AB; --on-sel:#1F262D; --ok:#9FB0C0; --warn:#D9B6AB; --bad:#E0A59C;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 10px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono)}

#app{display:flex;flex-direction:column;height:100vh}
header.top{display:flex;align-items:center;gap:8px;padding:18px 18px 14px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--mul)}
:root[data-theme="dark"] .logo{color:var(--orchid)}
.logo svg{width:30px;height:30px}
.brand b{font:600 25px/1 var(--ui);letter-spacing:-.03em;color:var(--ink)}
.brand b .dot{color:var(--pink)}
:root[data-theme="dark"] .brand b{color:var(--ink)}
.brand b em{font-style:normal}
.brand small{display:block;font:400 11px var(--ui);color:var(--muted);margin-top:3px}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--mul);color:#fff;transition:background .15s}
.iconbtn svg.i{width:18px;height:18px}
.iconbtn:hover{background:#2F3A44}
:root[data-theme="dark"] .iconbtn{background:var(--orchid);color:#1F262D}

.search{margin:0 18px 12px;position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--mul)}
.search svg{position:absolute;left:10px;top:9px;color:var(--muted);width:18px;height:18px}

/* barra de ícones */
nav.tabs{margin:0 18px 6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:2px;flex:none}
.ri svg.i{width:18px;height:18px;stroke-width:1.2}
.ri{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);transition:background .15s,color .15s;position:relative}
.ri:hover{background:var(--card2);color:var(--ink)}
.ri.on{background:var(--sel);color:var(--on-sel)}
.ri.home{color:var(--mul)}
.ri.home svg.i{stroke-width:1.7}
.ri.home.on{background:var(--soft);color:var(--mul)}
:root[data-theme="dark"] .ri.home{color:var(--orchid)}
.rg{display:flex;gap:2px;padding-left:6px;margin-left:4px;border-left:1px solid var(--line2)}
nav.tabs{row-gap:6px}
.railname{margin:2px 20px 6px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:14px}

main{flex:1;overflow-y:auto;padding:4px 18px 100px}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.hello{padding:4px 2px 2px}
.hello h1{margin:0;font:600 17px/1.3 var(--ui);color:var(--ink)}
:root[data-theme="dark"] .hello h1{color:var(--orchid)}
.hello h1 mark{background:none;color:var(--pink)}
.hello p{margin:3px 0 0;color:var(--muted);font-size:12px}
.sec{display:flex;align-items:baseline;gap:8px;margin:24px 4px 9px}
.sec .n{font:500 10.5px var(--mono);color:var(--accent-text)}
.sec h2{margin:0;font:700 11px/1 var(--ui);text-transform:uppercase;letter-spacing:.14em;color:var(--ink)}
.sec .cota{flex:1}
.sec .n{color:var(--muted)!important}

/* lista de ferramentas */
.grid{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tool{position:relative;text-align:left;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:14px;padding:12px 10px 12px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.tool:last-child{border-bottom:0}
.tool:hover{background:var(--card2)}
.ticon{width:24px;height:24px;display:grid;place-items:center;color:var(--ink2)}
.ticon svg.i{width:20px;height:20px}
.tool .tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.tool b{font-weight:500;font-size:13.5px}
.lk{color:var(--muted);display:grid}
.lk svg.i{width:14px;height:14px}
.view>.sec:first-child{margin-top:8px}
.tool span{font-size:11.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool .end{display:flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font:500 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.badge svg.i{width:11px;height:11px}
.badge.free{background:var(--tidal);color:var(--mul);border-color:transparent}
.star{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--line2)}
.star:hover{color:var(--pink)}
.star.on{color:var(--pink)}
.star.on svg{fill:currentColor}
.star svg.i{width:16px;height:16px}

.flow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.flow::-webkit-scrollbar{display:none}
.step{flex:none;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left}
.step:hover{border-color:var(--mul)}
.step .n{font:500 10px var(--mono);color:var(--accent-text)}
.step b{font-size:12px;font-weight:600;line-height:1.2}

.banner{display:flex;margin:4px 18px 6px!important;gap:10px;align-items:center;background:var(--mul);color:var(--tidal);border-radius:12px;padding:9px 10px 9px 12px}
.banner b{display:block;font-weight:600;font-size:12.5px}
.banner p{margin:0;font-size:11px;opacity:.85;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.banner svg.i{width:18px;height:18px}
.banner button{margin-left:auto;background:var(--tidal);color:var(--mul);border-radius:8px;padding:7px 11px;font-weight:700;font-size:12px;white-space:nowrap}

/* tela da ferramenta */
.thead{display:flex;align-items:center;gap:12px;margin:0 -18px;padding:4px 18px 16px;border-bottom:1px solid var(--line)}
.thead .ticon{width:28px;height:28px;color:var(--mul)}
:root[data-theme="dark"] .thead .ticon{color:var(--orchid)}
.thead .ticon svg.i{width:24px;height:24px}
.thead h1{margin:0;font:700 13px/1.2 var(--ui);text-transform:uppercase;letter-spacing:.12em}
.thead p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.4}
.backbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink2);flex:none}
.backbtn:hover{border-color:var(--mul);color:var(--mul)}
.backbtn svg.i{width:16px;height:16px}
.steps{display:flex;flex-wrap:wrap;gap:4px 14px;margin:14px 4px 0;padding:0;list-style:none;counter-reset:st}
.steps li{font-size:11.5px;color:var(--muted);counter-increment:st}
.steps li:before{content:counter(st);font:600 10.5px var(--mono);color:var(--pink);margin-right:5px}
.steps-old{display:none}
.steps div{flex:1;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:11px;line-height:1.3;color:var(--ink2)}
.steps i{display:block;font:500 10px var(--mono);font-style:normal;color:var(--accent-text);margin-bottom:2px}

.panel{margin-top:22px}
.panel.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.panel>h3,details.panel>summary{margin:0 0 9px 4px;font:700 11px/1 var(--ui);text-transform:uppercase;letter-spacing:.14em;color:var(--ink);display:flex;align-items:baseline;gap:6px}
.panel h3 em,.panel summary em{font:italic 400 11.5px var(--ui);letter-spacing:0;text-transform:none;color:var(--muted)}
.panel>h3 .n,details.panel>summary .n{display:none}
details.panel>summary{list-style:none;cursor:pointer;align-items:center}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary svg.i{width:16px;height:16px;color:var(--muted)}
.pk:last-child{margin-bottom:0}
details.panel>summary svg{margin-left:auto;transition:transform .2s}
details.panel[open]>summary svg{transform:rotate(180deg)}
details.panel:not([open])>summary{margin-bottom:0}
.fields{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.f{display:flex;flex-direction:column;gap:9px;min-width:0;padding:13px 16px;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f>label{font-size:13px;font-weight:500;color:var(--ink)}
.f.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:9px 12px}
.f.row>.inp{width:150px}
.f.row.wide{grid-template-columns:auto minmax(0,1fr)}
.f.row.wide>.inp{width:auto}
.f.row>.chips{grid-column:1/-1;justify-content:flex-end}
.inp{position:relative;display:flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:var(--rs);background:var(--card);transition:border .15s}
.inp:focus-within{border-color:var(--mul)}
.inp input,.inp select{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;padding:0 10px;font-family:var(--mono);font-size:13px;font-weight:500;text-align:center}
.inp select,.inp input[type=text]{text-align:left}
.inp select,.inp input[type=text]{font-family:var(--ui)}
.inp select{appearance:none;cursor:pointer}
.inp>svg.i{margin-right:10px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.inp .u{font:500 11px var(--mono);color:var(--muted);padding-right:4px}
.inp .pm{width:28px;height:100%;display:grid;place-items:center;color:var(--muted)}
.inp .pm:hover{color:var(--mul)}
textarea.ta{width:100%;min-height:70px;border:1px solid var(--line);border-radius:var(--rs);background:var(--card);padding:10px;outline:none;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:24px;padding:0 8px;border-radius:7px;background:var(--card);border:1px solid var(--line);font:500 11px var(--mono);color:var(--ink2)}
.chip:hover{border-color:var(--mul)}
.chip.on{background:var(--sel);color:var(--on-sel);border-color:transparent}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:3px;gap:3px}
.seg button{flex:1;min-height:30px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px}
.seg button svg.i{width:16px;height:16px}
.seg button.on{background:var(--mul);color:var(--tidal);font-weight:600}
:root[data-theme="dark"] .seg button.on{background:var(--orchid);color:#1F262D}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink2);text-align:center;line-height:1.15}
.card svg.pic{width:46px;height:40px}
.card:hover{border-color:var(--line2)}
.card.on{border-color:var(--mul);background:var(--soft);color:var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:28px;height:28px;border-radius:7px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.sw button.on{box-shadow:0 0 0 2px var(--mul)}
.swname{font-size:11px;color:var(--muted);margin-top:2px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);width:100%}
.tg input{display:none}
.tg i{width:40px;height:22px;border-radius:999px;background:var(--line);box-shadow:inset 0 0 0 1px var(--line2);position:relative;transition:background .2s;flex:none}
.tg i:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.tg input:checked+i{background:var(--mul);box-shadow:none}
:root[data-theme="dark"] .tg input:checked+i{background:var(--orchid)}
.tg input:checked+i:after{transform:translateX(18px)}
/* régua deslizante (como a da referência) */
.rng{display:flex;align-items:center;gap:8px;min-width:0}
.rng input[type=range]{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:var(--line);outline:none}
.rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer}
.rng .rv{width:52px;height:32px;border:1px solid var(--line);border-radius:8px;text-align:center;font:600 12.5px var(--mono);background:var(--card);outline:none}
.rng .ru{min-width:44px;height:32px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font:600 11.5px var(--ui);color:var(--ink);padding:0 6px}
.color{display:flex;align-items:center;gap:8px}
.color input{width:38px;height:38px;border:1px solid var(--line);border-radius:var(--rs);padding:3px;background:var(--card2);cursor:pointer}
.hint{display:flex;gap:9px;align-items:flex-start;background:var(--sand);border-radius:10px;padding:10px 12px;font-size:12px;color:#3E4B57;margin-top:10px}
:root[data-theme="dark"] .hint{background:var(--card2);color:var(--ink2)}
.hint svg.i{color:var(--mul);width:18px;height:18px;margin-top:1px}
:root[data-theme="dark"] .hint svg.i{color:var(--orchid)}

.preview{background:var(--card2);border:0;border-radius:10px;padding-top:26px!important;padding:10px;display:grid;place-items:center;min-height:150px;position:relative;overflow:hidden}
.preview svg{max-width:100%;height:auto}
.preview .tagline{position:absolute;left:10px;top:8px;font:500 10px var(--mono);color:var(--muted);letter-spacing:.04em}
.meter{margin-top:10px}
.meter .bar{height:6px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--tidal)}
.meter .dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--pink);transform:translateX(-50%);transition:left .3s}
.meter .lbl{display:flex;justify-content:space-between;font:400 10px var(--mono);color:var(--muted);margin-top:4px}

.actions{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 14px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;z-index:5}
.btn{height:44px;border-radius:10px;padding:0 16px;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s;position:relative;overflow:hidden;white-space:nowrap}
.btn.primary{flex:1;background:var(--grad);color:#fff}
.actions .btn{flex:1 1 0;min-width:0;font-size:12.5px;padding:0 10px;height:42px}
.actions .btn span,.actions .btn{overflow:hidden;text-overflow:ellipsis}
.actions .btn svg.i{width:17px;height:17px}
.btn.primary:hover{background:#2F3A44}
:root[data-theme="dark"] .btn.primary:hover{background:#E1C6BF}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--mul);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.busy{pointer-events:none}
.btn.busy:after{content:'';width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.btn.busy svg{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{display:none}
.more{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.more .btn{height:34px;font-size:12px;padding:0 12px;border-radius:9px}

.result{margin-top:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;animation:in .25s}
.result .rh{display:flex;align-items:center;gap:10px;padding:12px 14px}
.result .rh .st{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.result.ok .st{background:var(--mul);color:var(--tidal)}
:root[data-theme="dark"] .result.ok .st{background:var(--orchid);color:#1F262D}
.result.bad .st{background:rgba(154,91,83,.1);color:var(--bad)}
.result.warn .st{background:rgba(176,138,126,.12);color:var(--warn)}
.result .rh p{margin:0;font-size:12.5px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.stats div{padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.stats div:nth-child(odd){border-right:1px solid var(--line)}
.stats small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{font:500 14px var(--mono);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stats b .ok{color:var(--ok)} .stats b .no{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card2);position:sticky;top:0}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.tblwrap{max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.tbl input{width:84px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--card2);text-align:right;padding:0 6px;font-family:var(--mono);font-size:12px;outline:none}
.sheets{display:grid;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.sheet{background:var(--card2);border-radius:10px;padding:8px}
.sheet .sh{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.sheet .sh b{color:var(--ink);font-weight:600}
.totals{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:4px}
.totals div{display:flex;justify-content:space-between;font-size:12.5px}
.totals div.big{font-weight:600;font-size:16px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line2)}
.totals div.big b{color:var(--mul);font-family:var(--mono)}
.ring{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}
.ring svg{width:74px;height:74px}
.taglist{border-top:1px solid var(--line)}
.taglist button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px}
.taglist button:hover{background:var(--card2)}
.taglist button small{margin-left:auto;color:var(--muted);font-family:var(--mono)}
.taglist button.off{opacity:.45}

#toast{position:fixed;left:16px;right:16px;bottom:76px;display:flex;flex-direction:column;gap:6px;z-index:20;pointer-events:none}
.toast{background:var(--mul);color:var(--tidal);border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;animation:in .25s}
:root[data-theme="dark"] .toast{background:var(--orchid);color:#1F262D}
.toast.out{opacity:0;transition:opacity .3s}
.toast i{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none}

.surf{display:flex;align-items:center;gap:12px;width:100%}
.surf>div{flex:1;min-width:0}
.surf b{display:block;font-weight:500;font-size:13px}
.surf small,.tex small.muted{display:block;color:var(--muted);font-size:11.5px}
.btn.sm{height:34px;font-size:12px;padding:0 12px;border-radius:9px;flex:none}
.btn.sm svg.i{width:16px;height:16px}
.btn.sm em{font:600 10.5px var(--mono);font-style:normal;color:var(--muted)}
.tex{display:flex;flex-direction:column;gap:10px;width:100%}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card2)}
.th img,.th .swatch{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.th span{display:block;font-size:10px;color:var(--muted);padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;background:var(--card);display:grid;place-items:center;color:var(--ink2)}
.th button svg.i{width:13px;height:13px}
.texbtns{display:flex;flex-wrap:wrap;gap:8px}
.estbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--mul);color:#fff;border-radius:12px;padding:12px;width:100%}
.estbox div{background:rgba(255,255,255,.08);border-radius:9px;padding:9px 11px}
.estbox small{display:block;font-size:10.5px;opacity:.75}
.estbox b{font:600 17px var(--mono);color:var(--tidal)}
.estbox.empty{display:block;font-size:12px;opacity:.9}
:root[data-theme="dark"] .estbox{background:#1F262D}
.estmore{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.estmore b{color:var(--ink);font-family:var(--mono);font-weight:500}
.pk{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);margin-bottom:8px}
.pk .ticon{width:34px;height:34px}
.pk b{font-weight:600;font-size:13px}
.pk small{display:block;color:var(--muted);font-size:11px}
.pk .badge{margin-left:auto}
.pk.on .badge{background:var(--tidal);color:var(--mul);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty svg.i{width:30px;height:30px;color:var(--line2);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const arcPts=(cx,cy,r,a0,a1,n)=>Array.from({length:n+1},(_,i)=>{const t=(a0+(a1-a0)*i/n)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)];});
function rodProfile(m,h,e){ e=Math.max(e,.3); h=Math.max(h,1);
  if(m==='chanfrado'){ const c=Math.min(e*.8,h*.3); return [[0,0],[e,0],[e,h-c],[e-c,h],[0,h]]; }
  if(m==='boleado'){ const r=Math.min(e,h/2); return [[0,0],[e,0],...arcPts(e-r,h-r,r,0,90,6),[0,h]]; }
  if(m==='frisado'){ const f=Math.min(e*.25,.3); return [[0,0],[e,0],[e,h*.55],[e-f,h*.58],[e,h*.61],[e,h*.78],[e-f,h*.81],[e,h*.84],[e,h],[0,h]]; }
  if(m==='classico'){ const b=e*.55; return [[0,0],[e,0],[e,h*.62],...arcPts(e,h*.62+(e-b),e-b,270,180,5),[b,h*.9],[b+e*.2,h*.93],[b,h],[0,h]]; }
  if(m==='filete') return [[0,0],[Math.min(e,.6),0],[Math.min(e,.6),h],[0,h]];
  return [[0,0],[e,0],[e,h],[0,h]]; }
function moldProfile(m,s){ s=Math.max(s,1);
  if(m==='chanfro') return [[0,0],[s,0],[0,s]];
  if(m==='cove') return [[0,0],[s,0],...arcPts(s,s,s,270,180,8).slice(1)];
  if(m==='degrau') return [[0,0],[s,0],[s,s*.3],[s*.62,s*.3],[s*.62,s*.65],[s*.3,s*.65],[s*.3,s],[0,s]];
  if(m==='classica') return [[0,0],[s,0],[s,s*.15],...arcPts(s,s*.85,s*.7,270,180,6).slice(1),[s*.15,s],[0,s]];
  return [[0,0],[s,0],[s,1],[1,1],[1,s],[0,s]]; }

    const req = ++S.seq;

function prevCabinet(p){
  const lx=num(p.lx,60), lz=num(p.lz,90), rod=num(p.rod,0), tampo=p.tampo?num(p.esptampo,2):0, fr=+p.frente||1;
  const W=300,H=200, s=Math.min((W-80)/lx,(H-44)/lz), ox=(W-lx*s)/2-14, oy=H-26-lz*s;
  const X=v=>ox+v*s, Y=v=>oy+(lz-v)*s;
  const cF=hexOf(MAT_F,p.matfrente), cC=hexOf(MAT_F,p.matcaixa), cT=hexOf(MAT_T,p.mattampo);
  const hc=lz-rod-tampo, f=num(p.folga,.3);
  let g=`<rect x="${X(0)}" y="${Y(rod+hc)}" width="${lx*s}" height="${hc*s}" fill="${cC}" stroke="var(--ink2)" stroke-width="1"/>`;
  if(rod>0) g+=`<rect x="${X(num(p.esp,1.5))}" y="${Y(rod)}" width="${(lx-2*num(p.esp,1.5))*s}" height="${rod*s}" fill="#2F3A45" opacity=".75"/>`;
  if(tampo) g+=`<rect x="${X(0)}" y="${Y(lz)}" width="${lx*s}" height="${tampo*s}" fill="${cT}" stroke="var(--ink2)" stroke-width="1"/>`;
  const pz=(TIPOS[p.tipo]||TIPOS.inferior).pz, pux=+p.puxador||1;
  const front=(x,y,w,h,kind)=>{ // x,y canto inferior esquerdo em cm
    let r=`<rect x="${X(x)}" y="${Y(y+h)}" width="${w*s}" height="${h*s}" fill="${cF}" stroke="var(--ink2)" stroke-width="1" rx="1"/>`;
    if(pux===1) r+=`<rect x="${X(x)}" y="${Y(y+h)+(pz>.5?0:h*s-3)}" width="${w*s}" height="3" fill="#B8BCC0"/>`;
    if(pux===3) r+=`<rect x="${X(x)}" y="${Y(y+h)+(pz>.5?0:h*s-3)}" width="${w*s}" height="3" fill="#2F3A45" opacity=".7"/>`;
    if(pux===2){ if(kind==='h') r+=`<rect x="${X(x+w/2)-12}" y="${Y(y+h)+6}" width="24" height="3" rx="1.5" fill="#9DA2A7"/>`;
      else { const hx = kind==='l' ? X(x+w)-7 : X(x)+4; const hy = Y(y+h*pz)-10; r+=`<rect x="${hx}" y="${Math.max(Y(y+h)+3,Math.min(hy,Y(y)-23))}" width="3" height="20" rx="1.5" fill="#9DA2A7"/>`; } }
    return r; };
  const hp = fr===2 ? hc-num(p.hgav,18) : hc;
  if(fr===1||fr===2){ const n=+p.nportas||1, w=lx/n;
    for(let i=0;i<n;i++) g+=front(i*w+f/2, rod+f/2, w-f, hp-f, n===2&&i===1?'r':'l');
    if(fr===2) g+=front(f/2, rod+hp+f/2, lx-f, num(p.hgav,18)-f, 'h'); }
  else if(fr===3){ const n=Math.max(1,+p.ngav||3), h=hc/n; for(let i=0;i<n;i++) g+=front(f/2, rod+i*h+f/2, lx-f, h-f, 'h'); }
  else if(fr===5){ g+=front(f/2, rod+f/2, lx-f, hc-f, 'h'); }
  else { const e=num(p.esp,1.5); g+=`<rect x="${X(e)}" y="${Y(rod+hc-e)}" width="${(lx-2*e)*s}" height="${(hc-2*e)*s}" fill="#000" opacity=".12"/>`;
    const n=+p.prat||0; for(let i=1;i<=n;i++){ const y=rod+e+i*(hc-2*e)/(n+1); g+=`<rect x="${X(e)}" y="${Y(y)}" width="${(lx-2*e)*s}" height="${Math.max(2,e*s)}" fill="${cC}" stroke="var(--ink2)" stroke-width=".6"/>`; } }
  g+=dimH(X(0),X(lx),H-6,`${br(lx,0)}`)+dimV(Y(lz),Y(0),X(lx)+12,`${br(lz,0)}`);
  return `<span class="tagline">VISTA FRONTAL · cm</span><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>`;
}

/* ---- revestimento: o mesmo gerador de padrões do Ruby (tools/tiling.rb) ---- */
function tileRnd(a,b,s){ let x=(Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(s,2147483647))>>>0;
  x=Math.imul(x^(x>>>16),0x85ebca6b)>>>0; x=Math.imul(x^(x>>>13),0xc2b2ae35)>>>0; return ((x^(x>>>16))>>>0)/4294967296; }
function tileUnit(pat,w,h,j,amarr){
  const R=(x,y,a,b)=>[[x,y],[x+a,y],[x+a,y+b],[x,y+b]], sx=w+j, sy=h+j;
  if(pat==='vertical') return {t1:[h+j,0],t2:[0,w+j],tiles:[R(0,0,h,w)],base:0};
  if(pat==='diagonal') return {t1:[sx,0],t2:[0,sy],tiles:[R(0,0,w,h)],base:45};
  if(pat==='tijolo') return {t1:[sx,0],t2:[sx*(amarr==='terco'?1/3:.5),sy],tiles:[R(0,0,w,h)],base:0};
  if(pat==='chevron'){ const ca=Math.SQRT1_2, cw=w*ca, hv=h/ca, x0=cw+j;
    return {t1:[2*cw+2*j,0],t2:[0,hv+j/ca],tiles:[[[0,0],[cw,cw],[cw,cw+hv],[0,hv]],[[x0,cw],[x0+cw,0],[x0+cw,hv],[x0,cw+hv]]],base:0}; }
  if(pat==='espinha') return {t1:[h+j,h+j],t2:[w+j,-(w+j)],tiles:[R(0,0,w,h),R(0,h+j,h,w)],base:-45};
  return {t1:[sx,0],t2:[0,sy],tiles:[R(0,0,w,h)],base:0};
}
function tileHalf(poly,n,c){ const out=[]; poly.forEach((a,i)=>{ const b=poly[(i+1)%poly.length], da=a[0]*n[0]+a[1]*n[1]-c, db=b[0]*n[0]+b[1]*n[1]-c;
  if(da<=0) out.push(a); if((da<=0)!==(db<=0)){ const t=da/(da-db); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]); } }); return out; }
function tileStone(a,b,w,h,j,seed){
  const site=(i,k)=>[i*(w+j)+(tileRnd(i,k,1+seed)-.5)*.7*w, k*(h+j)+(tileRnd(i,k,2+seed)-.5)*.7*h];
  const s=site(a,b), r=2.5*Math.max(w,h); let cell=[[s[0]-r,s[1]-r],[s[0]+r,s[1]-r],[s[0]+r,s[1]+r],[s[0]-r,s[1]+r]];
  for(let di=-3;di<=3;di++) for(let dk=-3;dk<=3;dk++){ if(!di&&!dk) continue; const q=site(a+di,b+dk), n=[q[0]-s[0],q[1]-s[1]], d=Math.hypot(n[0],n[1]);
    const m=[(s[0]+q[0])/2,(s[1]+q[1])/2]; cell=tileHalf(cell,n,m[0]*n[0]+m[1]*n[1]-j/2*d); if(cell.length<3) return null; }
  return cell;
}
// peças (sem recorte) que cobrem o quadrado [-D, D]², já com a origem o
function tilePieces(p,D,o){
  const pat=p.padrao||'horizontal', w=Math.max(.5,num(p.pc,60)), h=Math.max(.5,num(p.pl,60)), j=p.seca?0:Math.max(0,num(p.rej,2))/10, seed=num(p.seed,0)|0;
  const u=tileUnit(pat,w,h,j,p.amarr); let t1=u.t1,t2=u.t2; if(pat==='organica'){ t1=[w+j,0]; t2=[0,h+j]; }
  const det=t1[0]*t2[1]-t1[1]*t2[0], out=[]; let A=[1e9,-1e9],B=[1e9,-1e9];
  [[-D,-D],[D,-D],[D,D],[-D,D]].forEach(q=>{ const d=[q[0]-o[0],q[1]-o[1]], a=(d[0]*t2[1]-d[1]*t2[0])/det, b=(t1[0]*d[1]-t1[1]*d[0])/det;
    A=[Math.min(A[0],a),Math.max(A[1],a)]; B=[Math.min(B[0],b),Math.max(B[1],b)]; });
  const m=Math.ceil((Math.max(w,h)*3)/Math.min(Math.hypot(...t1),Math.hypot(...t2)))+1;
  if((A[1]-A[0]+2*m)*(B[1]-B[0]+2*m)>9000) return {pieces:[],base:u.base};
  for(let a=Math.floor(A[0])-m;a<=Math.ceil(A[1])+m;a++) for(let b=Math.floor(B[0])-m;b<=Math.ceil(B[1])+m;b++){
    const bx=o[0]+a*t1[0]+b*t2[0], by=o[1]+a*t1[1]+b*t2[1];
    const tiles=pat==='organica'?[tileStone(a,b,w,h,j,seed)].filter(Boolean):u.tiles;
    tiles.forEach((t,ti)=>{ const pts=pat==='organica'?t.map(q=>[q[0]+o[0],q[1]+o[1]]):t.map(q=>[q[0]+bx,q[1]+by]);
      if(pts.every(q=>q[0]<-D)||pts.every(q=>q[0]>D)||pts.every(q=>q[1]<-D)||pts.every(q=>q[1]>D)) return;
      out.push({pts,k:((a+b)%2+2)%2,r:tileRnd(a*3+ti,b,9+seed)}); }); }
  return {pieces:out,base:u.base};
}
function tilePict(pat){
  const p={padrao:pat,pc:pat==='damas'?10:pat==='organica'?11:pat==='chevron'||pat==='espinha'?14:16,pl:pat==='damas'?10:pat==='organica'?9:pat==='chevron'||pat==='espinha'?4:7,rej:12,amarr:'meia'};
  const r=tilePieces(p,40,[-23,-20]), a=num(r.base,0);
  const polys=r.pieces.map(t=>`<polygon points="${t.pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"${pat==='damas'&&t.k?' fill="currentColor" fill-opacity=".35"':''}/>`).join('');
  return `<svg class="pic" viewBox="0 0 46 40" fill="none" stroke="currentColor" stroke-width=".9" stroke-linejoin="round"><defs><clipPath id="pc_${pat}"><rect x="5" y="5" width="36" height="30" rx="3"/></clipPath></defs><g clip-path="url(#pc_${pat})"><g transform="translate(23 20) rotate(${-a}) scale(1 -1)">${polys}</g></g></svg>`;
}

function prevTiles(p){
  const W=300,H=170, rw=400, rh=240, s=Math.min(W/rw,H/rh);
  const ang=num(p.ang,0), tex=(p.texturas||[]);
  const o=p.inicio==='centro'?[-num(p.pc,60)/2,-num(p.pl,60)/2]:[-rw/2,-rh/2];
  const r=tilePieces(p,Math.hypot(rw,rh)/2+10,o);
  const tone=(hex,k)=>{ const h=(hex||'#E9E3DC').replace('#',''); return '#'+[0,2,4].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(h.substr(i,2),16)*k))).toString(16).padStart(2,'0')).join(''); };
  const rough=['relevo','chanfrado','rustico'].includes(p.acabamento);
  const fill=t=>tex.length?`url(#tx${Math.floor(t.r*tex.length)%tex.length})`:(p.padrao==='damas'&&t.k?(p.cor2||'#3E4B57'):(rough?tone(p.cor,.86+.28*((t.r*7919)%1)):(p.cor||'#E9E3DC')));
  const defs=tex.map((f,i)=>`<pattern id="tx${i}" patternContentUnits="objectBoundingBox" width="1" height="1"><rect width="1" height="1" fill="${['#C9B49A','#B89C7E','#D8C6AE','#A88B6E'][i%4]}"/>${window.__MOCK__?'':`<image href="file:///${esc(f)}" width="1" height="1" preserveAspectRatio="none"/>`}</pattern>`).join('');
  const polys=r.pieces.map(t=>`<polygon points="${t.pts.map(q=>(q[0]*s).toFixed(1)+','+(q[1]*s).toFixed(1)).join(' ')}" fill="${fill(t)}" stroke="${p.seca?'rgba(0,0,0,.25)':(p.correj||'#BDB6AE')}" stroke-width="${p.seca?.5:1}" stroke-opacity="${p.seca?1:.9}"/>`).join('');
  const bg=p.seca?'#999':(p.mostrar_rej===false?'#ddd':(p.correj||'#BDB6AE'));
  return `<span class="tagline">${r.pieces.length?'AMOSTRA 4,00 × 2,40 m':'PEÇA PEQUENA DEMAIS PARA A PRÉVIA'}</span><svg viewBox="0 0 ${rw*s} ${rh*s}" width="${rw*s}" height="${rh*s}">
    <defs><clipPath id="room"><rect width="${rw*s}" height="${rh*s}" rx="6"/></clipPath>${defs}</defs>

const PCOLORS=['#F6DDF4','#EEF6C2','#EFE5E1','#F3C9EF','#E5EE9C','#EFEFEF'];

function fieldHtml(f, p, id){
  if(f.when && !f.when(p)) return '';
  const full = f.full ? ' full' : '';
  const lab = f.label ? `<label for="f_${f.k||''}">${esc(f.label)}</label>` : '';
  const v = p[f.k];
  switch(f.type){
    case 'num': return `<div class="f row${full}">${lab}<div class="inp"><button class="pm" data-step="-1" data-k="${f.k}" aria-label="Diminuir">${ic('minus')}</button><input id="f_${f.k}" data-k="${f.k}" inputmode="decimal" value="${v===''||v==null?'':esc(String(v).replace('.',','))}"><span class="u">${esc(f.unit||'')}</span><button class="pm" data-step="1" data-k="${f.k}" aria-label="Aumentar">${ic('plus')}</button></div>${f.chips?`<div class="chips">${f.chips.map(c=>`<button class="chip ${num(v)==c?'on':''}" data-set="${f.k}" data-v="${c}">${String(c).replace('.',',')}</button>`).join('')}</div>`:''}</div>`;
    case 'text': return `<div class="f${full}">${lab}<div class="inp"><input type="text" id="f_${f.k}" data-k="${f.k}" value="${esc(v)}"></div></div>`;
    case 'area': return `<div class="f${full}">${lab}<textarea class="ta" id="f_${f.k}" data-k="${f.k}">${esc(v)}</textarea></div>`;
    case 'seg': return `<div class="f${full}">${lab}<div class="seg">${f.opts.map(o=>`<button class="${String(v)===String(o[0])?'on':''}" data-set="${f.k}" data-v="${o[0]}">${o[2]?ic(o[2]):''}${o[1]}</button>`).join('')}</div></div>`;
    case 'cards': return `<div class="f${full}">${lab}<div class="cards">${f.opts.map(o=>`<button class="card ${String(v)===String(o[0])?'on':''}" data-set="${f.k}" data-v="${o[0]}">${P[o[2]]||''}${esc(o[1])}</button>`).join('')}</div></div>`;
    case 'sw': { const cur=f.opts.find(o=>o[0]===v)||f.opts[0]; return `<div class="f${full}">${lab}<div class="sw">${f.opts.map(o=>`<button class="${o[0]===v?'on':''}" style="background:${o[2]}" data-set="${f.k}" data-v="${o[0]}" title="${esc(o[1])}" aria-label="${esc(o[1])}"></button>`).join('')}</div><div class="swname">${esc(cur[1])}</div></div>`; }
    case 'tg': return `<div class="f${full}"><label class="tg"><span>${esc(f.label)}</span><input type="checkbox" data-k="${f.k}" ${v?'checked':''}><i></i></label></div>`;
    case 'range': return `<div class="f row wide${full}">${lab}<div class="rng"><input type="range" data-k="${f.k}" min="${f.min}" max="${f.max}" step="${f.step||1}" value="${esc(v)}" aria-label="${esc(f.label)}"><input class="rv" data-k="${f.k}" inputmode="decimal" value="${esc(v)}" aria-label="${esc(f.label)}"><span class="ru">${esc(f.unit||'')}</span></div></div>`;
    case 'color': return `<div class="f row${full}">${lab}<div class="color"><input type="color" data-k="${f.k}" value="${esc(v)}"><span class="mono" style="font-size:11px;color:var(--muted)">${esc(String(v).toUpperCase())}</span></div></div>`;
    case 'select': { const opts = f.dyn ? (S.dyn[f.dyn]||[]) : f.opts; return `<div class="f row wide${full}">${lab}<div class="inp"><select id="f_${f.k}" data-k="${f.k}">${opts.length?'':'<option value="">— clique em Atualizar lista —</option>'}${opts.map(o=>`<option value="${esc(o[0])}" ${String(v)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>${ic('down')}</div></div>`; }

function viewTool(id){
  const t=toolById(id), spec=FORMS[id];

  const p=S.params[id];
  let h=`<div class="view">
    <div class="thead"><button class="backbtn" data-back aria-label="Voltar" title="Voltar">${ic('back')}</button><div class="ticon">${ic(id)}</div><div><h1>${esc(t.name)}</h1><p>${esc(t.desc)}</p></div></div>`;
  if(t.locked) h+=`<div class="hint">${ic('lock')}<div>Esta ferramenta é do pacote <b>${esc(pkgName(t.package))}</b>. Você pode montar tudo e ver a prévia; para aplicar no modelo, ative sua chave em <a href="#" data-lic>Licença</a>.</div></div>`;
  if(t.steps&&t.steps.length) h+=`<ol class="steps">${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
  if(spec.prev) h+=`<div class="panel box"><div class="preview" id="prev">${spec.prev(p)}</div></div>`;
  spec.secs.forEach((s,i)=>{
    if(s.when && !s.when(p)) return;
    const body=`<div class="fields">${s.f.map(f=>fieldHtml(f,p,id)).join('')}</div>`;
    const opt = s.opt ? ' <em>opcional</em>' : '';
    h+= s.closed ? `<details class="panel"><summary>${esc(s.t)}${opt}${ic('down')}</summary>${body}</details>`
                 : `<div class="panel"><h3>${esc(s.t)}${opt}</h3>${body}</div>`;
  });
  const more=actsOf(spec.more,p);
  if(more.length) h+=`<div class="more">${more.map(a=>`<button class="btn ghost" data-act="${a[0]}">${ic(a[2])}${esc(a[1])}</button>`).join('')}</div>`;
  if(spec.hint) h+=`<div class="hint">${ic('info')}<div>${esc(spec.hint)}</div></div>`;
  h+=`<div id="result">${S.results[id]?resultHtml(id,S.results[id]):''}</div></div>`;
  return h;
}

const updMsg = u => ({available:`Versão ${u.version} disponível.`,downloading:`Baixando a versão ${u.version}…`,installed:`Versão ${u.version} instalada. Reinicie o SketchUp.`,latest:`Você está na versão mais nova (${u.version}).`,error:u.msg}[u.state]||'');

/* ---------------- ciclo de renderização ---------------- */
function renderUpdate(){
  const u=S.update, el=$('#updbar'); if(!el) return;
  if(!u||!['available','downloading','installed','error'].includes(u.state)||(u.state==='error'&&!S.updClicked)){ el.innerHTML=''; return; }
  const busy=u.state==='downloading', done=u.state==='installed';
  const title= done?`Versão ${esc(u.version)} instalada`: busy?`Baixando a versão ${esc(u.version)}…`: u.state==='error'?'Não deu para atualizar':`Nova versão ${esc(u.version)}`;
  const sub= done?'Feche e abra o SketchUp para usar.': u.state==='error'?esc(u.msg): esc((u.notes||[]).slice(0,2).join(' · ')||'Melhorias e correções');
  el.innerHTML=`<div class="banner">${ic(done?'check':'sparkle')}<div><b>${title}</b><p>${sub}</p></div>${done||busy?'':`<button data-upd="install">${u.state==='error'?'Tentar de novo':'Atualizar'}</button>`}</div>`;
}
function render(){
  if(!S.state) return;
  $('#ver').textContent = 'plugin · v' + S.state.version;
  renderUpdate();
  renderTabs();
  const m=$('#main'); let html; const acts=$('#actions');
  if(S.q) html=viewSearch(S.q);
  else if(S.route==='home') html=viewHome();
  else if(S.route==='license') html=viewLicense();
  else if(S.route.startsWith('tab:')) html=viewTab(S.route.slice(4));
  else if(S.route.startsWith('tool:')) html=viewTool(S.tool);
  m.innerHTML=html;
  const spec = S.route.startsWith('tool:') && !S.q ? FORMS[S.tool] : null;
  if(spec) renderActs(); else { acts.hidden=true; acts.innerHTML=''; }
}
function actsOf(a,p){ return typeof a==='function' ? a(p||{}) : (a||[]); }
function renderActs(){
  const spec=FORMS[S.tool], acts=$('#actions'); if(!spec) return;
  acts.hidden=false; acts.innerHTML=actsOf(spec.acts,S.params[S.tool]).map(a=>`<button class="btn ${a[3]?'primary':'ghost'}" data-act="${a[0]}">${ic(a[2])}${a[3]?esc(a[1]):`<span>${esc(a[1])}</span>`}</button>`).join('');
}
function refreshTool(keepScroll){
  const m=$('#main'), y=m.scrollTop, open=$$('details.panel',m).map(d=>d.open);
  m.innerHTML=viewTool(S.tool);
  if(typeof FORMS[S.tool].acts==='function') renderActs();
  $$('details.panel',m).forEach((d,i)=>{ if(open[i]) d.open=true; });
  $$('.view',m).forEach(v=>v.style.animation='none');
  if(keepScroll!==false) m.scrollTop=y;
}
function refreshPreview(){
  const spec=FORMS[S.tool]; const el=$('#prev');
  if(spec&&spec.prev&&el) el.innerHTML=spec.prev(S.params[S.tool]);
}
function go(route, tool){
  S.route=route; S.tool=tool||null; S.q=''; $('#q').value='';
  if(tool && !S.params[tool]) S.params[tool]=Object.assign(defaults(tool), store.get('p:'+tool,{}));
  render(); $('#main').scrollTop=0;
  if(tool && FORMS[tool] && FORMS[tool].onopen) runAct(FORMS[tool].onopen, true);
  if(tool && FORMS[tool] && FORMS[tool].est) scheduleEst(true);
}
function setParam(k, v, full){
  const p=S.params[S.tool]; p[k]=v; store.set('p:'+S.tool,p);
  const f=findField(S.tool,k); if(f&&f.onchange) f.onchange(p,v);
  if(f&&f.live) call(S.tool, f.live, Object.assign({},p));
  if(full) refreshTool(); else refreshPreview();
  if(FORMS[S.tool]&&FORMS[S.tool].est) scheduleEst();
}
function findField(id,k){ let r=null; (FORMS[id]?FORMS[id].secs:[]).forEach(s=>s.f.forEach(f=>{ if(f.k===k) r=f; })); return r; }

/* ---------------- ações ---------------- */
async function runAct(action, silent, btn){
  const id=S.tool; let p=Object.assign({}, S.params[id]);
  let a=action;
  if(action==='rot_ccw'||action==='rot_cw'){ const r=(num(S.params[id].rot,0)+(action==='rot_cw'?-90:90)+360)%360; S.params[id].rot=r; store.set('p:'+id,S.params[id]); return runAct('apply',silent,btn); }
  if(action==='center'){ setParam('inicio','centro',true); toast('Paginação centralizada na face.'); return; }
  if(action==='vary'){ setParam('seed',num(S.params[id].seed,0)+1,true); return; }
  if(action.startsWith('assign:')){ p.cat=action.slice(7); a='assign'; }
  if(btn) btn.classList.add('busy');
  const res=await call(id, a, p);
  if(btn) btn.classList.remove('busy');
  if(res.values){ Object.assign(S.params[id], res.values); store.set('p:'+id,S.params[id]); }
  if(res.surface) S.dyn.surface=res.surface;
  if(FORMS[id]&&FORMS[id].est&&(res.values||a==='build')) scheduleEst();
  if(silent===false&&!res.stats&&res.ok&&(a==='add_image'||a==='edit')){ toast(res.msg); refreshTool(); return; }
  if(res.settings && Object.keys(res.settings).length){ Object.assign(S.params[id], res.settings); store.set('p:'+id,S.params[id]); }
  if(res.mats){ S.dyn.mats=[['','— sem material —']].concat(res.mats.map(m=>[m[0],m[1]])); if(silent&&res.ok&&S.tool===id) refreshTool(); }
  if(res.defs){ S.dyn.defs=res.defs.map(d=>[d[0],`${d[0]} (${d[1]})`]); if(!S.params[id].def&&res.defs[0]) S.params[id].def=res.defs[0][0]; if(silent&&res.ok&&S.tool===id) refreshTool(); }
  if(res.picking){ toast(res.msg); if(res.stats){ S.results[id]=res; } refreshTool(); return; }
  if(!(silent&&res.ok)) { S.results[id]=res; refreshTool(); const r=$('#result'); if(r&&r.firstChild) r.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  if(!res.ok && res.locked) toast(res.msg);
}

function toast(msg){
  if(!msg) return;
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<i></i><span>${esc(msg)}</span>`;
  $('#toast').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),300); }, 4200);
}
function ripple(e, el){
  const r=el.getBoundingClientRect(), d=Math.max(r.width,r.height), s=document.createElement('span');
  s.className='ripple'; s.style.width=s.style.height=d+'px'; s.style.left=(e.clientX-r.left-d/2)+'px'; s.style.top=(e.clientY-r.top-d/2)+'px';
  el.appendChild(s); setTimeout(()=>s.remove(),600);
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('button,[data-fav],[data-lic],[data-tab],a');
  if(!el) return;
  if(el.classList.contains('btn')) ripple(e, el);
  const d=el.dataset;
  if(d.fav!==undefined){ e.stopPropagation(); const id=d.fav; const f=S.state.favorites; const i=f.indexOf(id); i>=0?f.splice(i,1):f.push(id); send('favorite',id); render(); return; }
  if(d.tab){ go(d.tab==='home'?'home':'tab:'+d.tab); return; }
  if(d.tool){ go('tool:'+d.tool, d.tool); return; }
  if(d.back!==undefined){ go('home'); return; }
  if(d.lic!==undefined){ e.preventDefault(); go('license'); return; }
  if(d.set){ const f=findField(S.tool,d.set); let v=d.v; if(f&&(f.type==='num'||typeof f.def==='number')) v=num(v); setParam(d.set, v, true); return; }
  if(d.step){ const k=d.k, f=findField(S.tool,k); const st=(f&&f.step)||1; let v=+(num(S.params[S.tool][k])+st*(+d.step)).toFixed(3);
    if(f&&f.min!=null) v=Math.max(f.min,v); if(f&&f.max!=null) v=Math.min(f.max,v); setParam(k,v,true); return; }
  if(d.preset!==undefined){ const o=JSON.parse(d.fk); Object.assign(S.params[S.tool],o); store.set('p:'+S.tool,S.params[S.tool]); refreshTool(); if(FORMS[S.tool].est) scheduleEst(); return; }
  if(d.texdel!==undefined){ const p=S.params[S.tool], t=(p.texturas||[]).slice(); t.splice(+d.texdel,1); setParam('texturas',t,true); return; }
  if(d.act){ runAct(d.act,false,el.classList.contains('btn')?el:null); return; }
  if(d.upd){
    if(d.upd==='install'){ S.updClicked=true; S.update=Object.assign({},S.update,{state:'downloading'}); renderUpdate(); }
    else toast('Procurando atualização…');
    if(window.__MOCK__){ const v=(S.update||{}).version||S.state.version; setTimeout(()=>PLN.on('update', d.upd==='install'?{state:'installed',version:v}:{state:'latest',version:S.state.version}), 600); }
    else send('update',d.upd);
    return; }
  if(d.tag){ S.params.auto_tags=S.params.auto_tags||{}; call('auto_tags','toggle',{tag:d.tag}).then(r=>{ S.results.auto_tags=r; refreshTool(); }); return; }
  if(el.id==='btnTheme'){ const dark=document.documentElement.dataset.theme!=='dark'; setTheme(dark?'dark':'light'); send('theme',dark?'dark':'light'); return; }
  if(el.id==='btnLic'){ go('license'); return; }
  if(el.id==='btnKey'){ const k=$('#key').value.trim(); if(!k) return toast('Cole a chave que você recebeu.'); if(window.__MOCK__) return toast('Chave ativada (prévia).'); send('activate',k); return; }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='q'){ S.q=el.value.trim(); const m=$('#main'); if(S.q){ m.innerHTML=viewSearch(S.q); $('#actions').hidden=true; } else render(); return; }
  const k=el.dataset.k;
  if(k && S.tool){ const f=findField(S.tool,k);
    let v = el.type==='checkbox' ? el.checked : el.value;
    if(f&&f.type==='num') v = el.value.trim()===''?'':num(el.value);
    if(f&&f.type==='range'){ v=num(el.value); $$('[data-k="'+k+'"]').forEach(x=>{ if(x!==el) x.value=v; }); }
    const p=S.params[S.tool]; p[k]=v; store.set('p:'+S.tool,p);
    if(f&&f.live) call(S.tool, f.live, Object.assign({},p));
    if(FORMS[S.tool]&&FORMS[S.tool].est) scheduleEst();
    if(el.type==='checkbox'||el.type==='color'||(f&&f.onchange)) { if(f&&f.onchange) f.onchange(p,v); refreshTool(); }
    else { refreshPreview(); $$('[data-set="'+k+'"]').forEach(c=>c.classList.toggle('on', num(c.dataset.v)===num(v))); }
    return; }
  if(el.id==='autoUpd'){ S.state.auto_update=el.checked; send('update', el.checked?'auto_on':'auto_off'); }
});
document.addEventListener('change', e=>{ const el=e.target; if(el.tagName==='SELECT'&&el.dataset.k&&S.tool){ setParam(el.dataset.k, el.value, true); } });
window.addEventListener('focus', ()=>{ if(S.tool&&FORMS[S.tool]&&FORMS[S.tool].est) scheduleEst(true); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&S.route!=='home'){ go('home'); } });

function setTheme(t){ document.documentElement.dataset.theme=t; $('#btnTheme').innerHTML=ic(t==='dark'?'sun':'moon'); }

/* ---------------- API chamada pelo Ruby ---------------- */
window.PLN = {
  init(state){
    S.state=state; S.update=state.update||null; setTheme(state.theme||'light');
    $('#btnLic').innerHTML=ic('key'); $('#sIcon').innerHTML=ic('search'); $('#logo').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"><path d="M4 4h16v16H4zM14 4v6M4 13h7" stroke="currentColor"/><path d="M11 13A7 7 0 0 1 4 20" stroke="#A88A80"/></svg>';
    if(state.open && toolById(state.open)) go('tool:'+state.open, state.open);
    else if(state.open==='license') go('license');
    else render();
  },
  onResult([req, res]){ const r=S.reqs[req]; delete S.reqs[req]; if(r) r(res||{ok:false,msg:'Sem resposta.'}); },
  on(ev, data){
    if(ev==='result'){ const id=data.tool;
      if(data.values&&S.params[id]){ Object.assign(S.params[id],data.values); store.set('p:'+id,S.params[id]); }
      if(data.surface) S.dyn.surface=data.surface;
      if(data.mats) S.dyn.mats=[['','— sem material —']].concat(data.mats.map(m=>[m[0],m[1]]));
      if(data.stats) S.results[id]=data;
      if(S.tool===id){ refreshTool(); if(FORMS[id]&&FORMS[id].est) scheduleEst(true); } toast(data.msg); }
    else if(ev==='favorites'){ S.state.favorites=data; }
    else if(ev==='update'){ S.update=data; renderUpdate(); if(S.route==='license') render(); if(data.state==='installed'||(data.state==='error'&&S.updClicked)) toast(updMsg(data)); }
    else if(ev==='license'){ toast(data.msg); }
    else if(ev==='open'){ if(data.id) go('tool:'+data.id, data.id); }
  }
};

  cut(){
    const pk=(pcs,W,H)=>{ // mesma lógica do Ruby (prateleiras)
      const k=4,t=10,uw=W-2*t,uh=H-2*t; const L=pcs.map(p=>p.h>p.w?{...p,w:p.h,h:p.w}:p).sort((a,b)=>b.h-a.h||b.w-a.w); const sh=[];
      L.forEach(p=>{ let ok=false; for(const s of sh){ const sl=s.sl.find(x=>p.h<=x.h&&x.x+p.w<=uw); if(sl){ s.parts.push({x:t+sl.x,y:t+sl.y,w:p.w,h:p.h,label:p.label}); sl.x+=p.w+k; ok=true; break; }
        const top=s.sl.length?s.sl[s.sl.length-1].y+s.sl[s.sl.length-1].h+k:0; if(top+p.h<=uh){ s.sl.push({y:top,h:p.h,x:p.w+k}); s.parts.push({x:t,y:t+top,w:p.w,h:p.h,label:p.label}); ok=true; break; } }
        if(!ok) sh.push({w:W,h:H,sl:[{y:0,h:p.h,x:p.w+k}],parts:[{x:t,y:t,w:p.w,h:p.h,label:p.label}]}); }); return sh; };
    const rows=[['Lateral esquerda',3,720,560,15],['Lateral direita',3,720,560,15],['Base',3,570,554,15],['Travessa superior',3,570,554,15],['Prateleira',2,570,534,15],['Rodapé',3,570,100,15],['Lateral da gaveta',6,520,120,15],['Contrafrente',6,544,120,15]];
    const pcs=[]; rows.forEach(r=>{ for(let i=0;i<r[1];i++) pcs.push({w:r[2],h:r[3],label:r[0]}); });
    const sheets=pk(pcs,2750,1840);
    return {ok:true,msg:'48 peças lidas.',stats:[['Peças de chapa','48'],['Chapas','3'],['Fita · Branco TX','31,40 m (+10%)'],['Tampos','3 · 1,04 m²']],
      rows:rows.map(r=>({name:r[0],qty:r[1],l:r[2],w:r[3],t:r[4],mat:'Branco TX',fita:0})),
      plans:[{mat:'Branco TX · 15,0 mm',count:sheets.length,aproveitamento:78.4,sheets:sheets},{mat:'Freijó · 18,0 mm',count:1,aproveitamento:61.2,sheets:pk([{w:597,h:717,label:'Porta'},{w:597,h:717,label:'Porta'},{w:597,h:177,label:'Frente da gaveta'},{w:447,h:217,label:'Frente da gaveta'},{w:447,h:217,label:'Frente da gaveta'},{w:447,h:217,label:'Frente da gaveta'}],2750,1840)}],
      hardware:[['Dobradiça 35 mm com amortecedor',6],['Corrediça telescópica (par)',4],['Perfil puxador (m) · barras de 3 m: 1',2.4]]};
  }
